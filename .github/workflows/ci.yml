name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ganador
          POSTGRES_PASSWORD: ganador
          POSTGRES_DB: ganador
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ganador" --health-interval 10s --health-retries 5
    env:
      # Las pruebas de integración usan PGlite por defecto; con esta variable corren
      # contra PostgreSQL real.
      TEST_DATABASE_URL: postgres://ganador:ganador@localhost:5432/ganador
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
